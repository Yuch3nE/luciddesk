name: Build CI
on:
  push:
    tags: ['**']
    branches: ['codex/ci-compare-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test bilingual release notes
        run: python3 -m unittest discover -s tools -p "test_release_notes.py"
      - name: Check minimal EXE installer payload
        run: python3 -m unittest discover -s tools -p "test_installer_payload.py"
      - name: Check language resources
        run: python3 tools/check-locales.py
      - name: Test release assets with optional MSI
        run: python3 -m unittest discover -s tools -p "test_refresh_release.py"
  build:
    runs-on: windows-2025-vs2026
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TARGET_DIR: target/ci-tests
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select latest installed x64 MSVC and Windows SDK
        shell: pwsh
        run: ./tools/use-windows-toolchain.ps1 -GitHubActions
      - name: Install Rust
        shell: pwsh
        run: |
          $toolchain = Get-Content rust-toolchain.toml -Raw
          $channel = [regex]::Match($toolchain, 'channel\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $channel) { throw 'Missing pinned Rust version.' }
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain installation failed.' }
          rustc -vV
          cargo -V
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package version.' }
          $version = ($metadata.packages | Where-Object name -eq 'luciddesk').version
          if (@($version, "v$version") -cnotcontains $env:GITHUB_REF_NAME) { throw 'Tag must match the app version: <version> or v<version>.' }
      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target/ci-tests
            . -> target/production
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST LUCIDDESK_WINDOWS_BUILD_ENVIRONMENT
          cache-bin: false
      - name: Test app rules and WARP emoji rendering
        run: cargo test -p luciddesk --bin luciddesk --locked -- i18n::tests pane::settings::agent::tests pane::marquee::tests pane::title_emoji::tests updates::tests --test-threads=1 --skip marquee_window_messages_commit_cancel_and_ignore_mapped_folders
      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked
      - name: Test CLI commands and control protocol
        run: cargo test -p luciddesk-cli -p luciddesk-api --locked -- --test-threads=1
      - name: Test layout plans and deferred task reentry
        run: python tools/test-control-ci.py
      - name: Test workspace data and layout rules
        run: cargo test -p luciddesk-core -p luciddesk-storage --lib --locked
      - name: Test drag image alpha conversion
        run: cargo test -p luciddesk-shell --lib drag_image::tests::alpha_conversion_preserves_transparency_and_edge_colors --locked -- --exact
      - name: Test Canvas compatibility with WARP
        run: cargo test -p luciddesk --test canvas_compat --locked -- --test-threads=1
      - name: Test workspace documentation examples
        run: cargo test --workspace --doc --locked
      - name: Verify complete Skill directory in MSI payload
        run: python -m unittest discover -s tools -p "test_msi_payload.py"
      - name: Cache Inno Setup compiler
        uses: actions/cache@v5
        with:
          path: target/tooling/inno-*
          key: inno-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ensure-inno.ps1') }}
      - name: Prepare Inno Setup compiler
        shell: pwsh
        run: ./tools/ensure-inno.ps1
      - name: Package EXE and ZIPs and verify static VC runtime imports
        shell: pwsh
        run: ./tools/package.ps1 -All -InstallerFormat Exe
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: LucidDesk-windows-x64
          compression-level: 0
          path: |
            target/packages/*.zip
            target/packages/*.sha256
            target/portable/**/*.zip
            target/portable/**/*.sha256
            target/installers/**/*-setup.exe
            target/installers/**/*-setup.exe.sha256
          if-no-files-found: error
  release:
    needs: [metadata, build]
    if: github.repository == 'Yuch3nE/luciddesk' && startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: LucidDesk-windows-x64
          path: artifacts
      - name: Verify and publish bilingual release / 校验并发布双语 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/release-notes.py --tag "$RELEASE_TAG" --repository "$GH_REPO" --changelog CHANGELOG.md --changelog-en CHANGELOG.en.md --output release-notes.md
          mapfile -d '' archives < <(find artifacts -type f \( -name '*.zip' -o -name '*-setup.exe' \) -print0)
          mapfile -d '' checksums < <(find artifacts -type f -name '*.sha256' -print0)
          [[ ${#archives[@]} -eq 3 && ${#checksums[@]} -eq 3 ]]
          for checksum in "${checksums[@]}"; do
            (cd "$(dirname "$checksum")" && sha256sum -c "$(basename "$checksum")")
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${archives[@]}" "${checksums[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${archives[@]}" "${checksums[@]}" --verify-tag --title "LucidDesk $RELEASE_TAG" --notes-file release-notes.md
          fi
