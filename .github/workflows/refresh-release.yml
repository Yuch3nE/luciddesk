name: Refresh release packages
on:
  push:
    branches: [main]
    paths: ['.github/release-refresh.json']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (for example v0.15.0)
        required: true
        type: string
      source_run_id:
        description: Successful Build CI run containing verified packages
        required: true
        type: string
      source_sha:
        description: Full source commit SHA of that build
        required: true
        type: string
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'Yuch3nE/luciddesk'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read release refresh request
        id: request
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          request = ({key: os.environ[key.upper()] for key in ('release_tag', 'source_run_id', 'source_sha')}
                     if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                     else json.loads(Path('.github/release-refresh.json').read_text()))
          assert re.fullmatch(r'v?[0-9]+\.[0-9]+\.[0-9]+', request['release_tag'])
          assert re.fullmatch(r'[0-9]+', request['source_run_id'])
          assert re.fullmatch(r'[0-9a-f]{40}', request['source_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in request.items():
                  assert key in ('release_tag', 'source_run_id', 'source_sha')
                  output.write(f'{key}={value}\n')
          PY
      - uses: actions/download-artifact@v8.0.1
        with:
          name: LucidDesk-windows-x64
          path: artifacts
          run-id: ${{ steps.request.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify and replace existing release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.request.outputs.release_tag }}
          SOURCE_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: python3 tools/release/refresh-release.py
