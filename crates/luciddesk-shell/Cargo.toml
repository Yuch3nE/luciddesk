[package]
name = "luciddesk-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop-menu-diagnostics = []
menu-diagnostics = []

[[example]]
name = "desktop_menu_service_probe"
required-features = ["desktop-menu-diagnostics"]

[[example]]
name = "folder_menu_bridge_probe"
required-features = ["desktop-menu-diagnostics"]

[dependencies]
luciddesk-diagnostics.workspace = true
luciddesk-menu.workspace = true
luciddesk-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_SystemServices",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
] }
windows-core = "0.62.2"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
] }

[dev-dependencies]
serde_json = "1"
windows = { workspace = true, features = ["Win32_System_Search", "Win32_System_Search_Common", "Win32_Storage_EnhancedStorage"] }
windows-window.workspace = true
luciddesk-explorer.workspace = true
luciddesk-window.workspace = true

[lints]
workspace = true

[[example]]
name = "desktop_filter_probe_hook"
required-features = ["desktop-menu-diagnostics"]
path = "examples/support/desktop_filter_probe_hook.rs"
crate-type = ["cdylib"]

[[example]]
name = "desktop_filter_probe"
required-features = ["desktop-menu-diagnostics"]
