[package]
name = "luciddesk-monitor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
test-diagnostics = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
tempfile = "3"
luciddesk-plugin-api = { path = "../../crates/luciddesk-plugin-api" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "disk"] }
windows-canvas = { version = "=0.100.0", default-features = false }
canvas-core = { package = "windows-core", version = "=0.100.0", default-features = false }
windows-numerics.workspace = true
windows = { workspace = true, features = ["Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { workspace = true, features = ["Win32_System_Performance"] }

[package.metadata.luciddesk]
plugin = "system-monitor"
