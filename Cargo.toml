[workspace]
members = [
    "app",
    "cli",
    "crates/luciddesk-api",
    "crates/luciddesk-diagnostics",
    "crates/luciddesk-core",
    "crates/luciddesk-graphics",
    "crates/luciddesk-shell",
    "crates/luciddesk-menu",
    "crates/luciddesk-storage",
    "crates/luciddesk-window",
    "crates/luciddesk-explorer",
]
resolver = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
luciddesk-diagnostics = { path = "crates/luciddesk-diagnostics" }
luciddesk-menu = { path = "crates/luciddesk-menu" }
luciddesk-core = { path = "crates/luciddesk-core" }
luciddesk-shell = { path = "crates/luciddesk-shell" }
luciddesk-storage = { path = "crates/luciddesk-storage" }
luciddesk-window = { path = "crates/luciddesk-window" }
luciddesk-explorer = { path = "crates/luciddesk-explorer" }
# Panel IDs use u64; preserve checked INTEGER conversions in rusqlite 0.40.
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "fallible_uint"] }
windows-window = "0.100.0"
windows-numerics = "0.3.1"
windows-sys = "0.61.2"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
raw_borrows_via_references = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
